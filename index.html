<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Simulator Roleplay - Index1</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f9f9f9; }
        h1, h2 { text-align: center; color: #333; }
        section { max-width: 600px; margin: 20px auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        button { margin-top: 10px; padding: 10px; background-color: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; }
        button:hover { background-color: #0056b3; }
        .play-btn { background-color: #ffc107; color: #000; }
        .play-btn:hover { background-color: #e0a800; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
    <script>
        const SUPABASE_URL = 'https://your-project.supabase.co'; // ใส่ URL ของคุณ
        const SUPABASE_ANON_KEY = 'your-anon-key'; // ใส่ anon key ของคุณ
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // ฟังก์ชันเล่นเสียงจาก Supabase
        async function playAudio(fileName) {
            const { data, error } = await supabaseClient.storage.from('audio-recordings').download(fileName);
            if (error) {
                console.error('Download error:', error.message);
                alert('ไม่พบไฟล์เสียง');
            } else {
                const url = URL.createObjectURL(data);
                const audio = new Audio(url);
                audio.play();
            }
        }

        // ฟังก์ชันเล่นเสียงตอบอัตโนมัติของลูกค้าในช่วงสุขภาพ
        function playHealthResponse() {
            const responses = ['health-yes.wav', 'health-no.wav'];
            const randomResponse = responses[Math.floor(Math.random() * responses.length)];
            playAudio(randomResponse);
        }

        // คำถามของแต่ละช่วง
        const questions = {
            intro: 'กรุณากล่าวเปิดตัวตามสคริปต์ที่กำหนด',
            pitch: 'นำเสนอผลิตภัณฑ์ตามสคริปต์',
            qa: [
                'คำถามที่ 1: ประกันนี้คุ้มครองอะไร?',
                'คำถามที่ 2: เบี้ยประกันเท่าไหร่?',
                'คำถามที่ 3: มีส่วนลดไหม?',
                'คำถามที่ 4: ระยะเวลาคุ้มครองกี่ปี?',
                'คำถามที่ 5: มีเงื่อนไขอะไรบ้าง?',
                'คำถามที่ 6: สามารถยกเลิกได้ไหม?',
                'คำถามที่ 7: มีค่าธรรมเนียมเพิ่มเติมหรือไม่?',
                'คำถามที่ 8: มีบริการหลังการขายไหม?',
                'คำถามที่ 9: มีสิทธิพิเศษอะไรบ้าง?',
                'คำถามที่ 10: ถ้าต้องเคลมทำอย่างไร?'
            ],
            closing: 'สรุปและปิดการขายตามเงื่อนไข',
            health: 'ใน 5 ปีที่ผ่านมา ท่านเคยได้รับการบาดเจ็บหรือไม่?', // จำกัดเหลือ 1 ข้อ
            register: 'กรอกข้อมูลลูกค้าเพื่อปิดงาน'
        };

        let currentQAIndex = 0;
        function showNextQAQuestion() {
            if (currentQAIndex < questions.qa.length) {
                alert(questions.qa[currentQAIndex]);
                currentQAIndex++;
            } else {
                alert('จบคำถามทั้งหมดแล้ว');
            }
        }

        function showQuestion(section) {
            if (section === 'qa') {
                showNextQAQuestion();
            } else if (section === 'health') {
                alert(questions.health);
                playHealthResponse(); // เล่นเสียงตอบอัตโนมัติหลังแสดงคำถาม
            } else {
                alert(questions[section]);
            }
        }
    </script>
</head>
<body>
    <h1>ระบบ E-Simulator Roleplay (Index1)</h1>

    <section>
        <h2>ช่วงที่ 1: เปิดตัว</h2>
        <button onclick="showQuestion('intro')">แสดงคำถาม</button>
        <button class="play-btn" onclick="playAudio('intro.wav')">▶️ เล่นเสียงลูกค้า</button>
    </section>

    <section>
        <h2>ช่วงที่ 2: Pitch</h2>
        <button onclick="showQuestion('pitch')">แสดงคำถาม</button>
        <button class="play-btn" onclick="playAudio('pitch.wav')">▶️ เล่นเสียงลูกค้า</button>
    </section>

    <section>
        <h2>ช่วงที่ 3: ตอบคำถาม (10 ข้อ)</h2>
        <button onclick="showQuestion('qa')">แสดงคำถามถัดไป</button>
        <button class="play-btn" onclick="playAudio('qa-' + currentQAIndex + '.wav')">▶️ เล่นเสียงลูกค้า</button>
    </section>

    <section>
        <h2>ช่วงที่ 4: สุขภาพ (เหลือ 1 ข้อ)</h2>
        <button onclick="showQuestion('health')">แสดงคำถามสุขภาพ</button>
        <button class="play-btn" onclick="playAudio('health.wav')">▶️ เล่นเสียงคำถาม</button>
    </section>

    <section>
        <h2>ช่วงที่ 5: ลงทะเบียนลูกค้า</h2>
        <button onclick="showQuestion('register')">แสดงคำถาม</button>
        <button class="play-btn" onclick="playAudio('register.wav')">▶️ เล่นเสียงลูกค้า</button>
    </section>
</body>
</html>
